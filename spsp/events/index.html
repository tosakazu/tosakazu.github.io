<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大会一覧 — SPSP</title>
<meta name="description" content="SPSP に集約されたスマブラSP の日本大会一覧。最新の大会から検索・絞り込みできる。">
<link rel="canonical" href="https://tosakazu.github.io/spsp/events/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SPSP">
<meta property="og:title" content="SPSP 大会一覧">
<meta property="og:description" content="スマブラSP 日本大会一覧">
<meta property="og:url" content="https://tosakazu.github.io/spsp/events/">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
    background: #ffffff; color: #111827; font-size: 14px;
    -webkit-text-size-adjust: 100%;
  }

  .header { max-width: 1400px; margin: 0 auto; padding: 20px 24px 0; }
  h1 { font-size: 22px; color: #111827; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 10px; }

  .filter-section {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin: 0 0 4px;
  }
  .filter-label { font-size: 11px; color: #6b7280; flex-shrink: 0; }
  .filter-chips {
    display: inline-flex; gap: 6px; flex-wrap: wrap; margin: 0;
  }
  .chip {
    padding: 4px 10px; border-radius: 14px; font-size: 11px;
    background: #f3f4f6; color: #6b7280; cursor: pointer; user-select: none;
    border: 1px solid transparent;
  }
  .chip:hover { background: #e5e7eb; color: #111827; }
  .chip.active { background: #dc2626; color: #fff; border-color: #dc2626; }

  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0;
  }
  input, button, select {
    padding: 8px 12px; border: 1px solid #e5e7eb;
    background: #ffffff; color: #111827;
    border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  input[type="search"] { min-width: 280px; flex: 1; }
  .status { color: #6b7280; font-size: 12px; }

  .table-wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px 32px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; background: #ffffff; color: #374151;
    padding: 10px 8px; border-bottom: 2px solid #e5e7eb;
    user-select: none; cursor: pointer; font-weight: 600;
    position: sticky; top: 56px; z-index: 2;
  }
  th:hover { color: #dc2626; }
  th.sortable::after { content: "↕"; opacity: 0.3; margin-left: 4px; font-size: 10px; }
  th.sorted-asc::after { content: "↑"; opacity: 1; }
  th.sorted-desc::after { content: "↓"; opacity: 1; }
  td { padding: 10px 8px; border-bottom: 1px solid #f3f4f6; }

  tr.event-row { transition: background 0.1s; }
  tr.event-row:hover { background: #f9fafb; }
  tr.event-row td.col-name a {
    color: #dc2626; font-weight: 500; text-decoration: none;
  }
  tr.event-row td.col-name a:hover { text-decoration: underline; }
  tr.event-row td.col-name .no-detail {
    color: #6b7280; font-weight: 500;
  }
  /* 主な参加者 (top 3) 行 */
  .top-players {
    margin-top: 3px; font-size: 11px; color: #9ca3af;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.3;
  }
  .top-players a { color: #6b7280; text-decoration: none; }
  .top-players a:hover { color: #dc2626; text-decoration: underline; }
  .top-players .place {
    color: #111827; font-weight: 600; margin-right: 3px;
    font-variant-numeric: tabular-nums;
  }
  .top-players .rank { color: #9ca3af; font-size: 10px; margin-left: 2px; }
  .top-players .sep { color: #d1d5db; margin: 0 5px; }
  @media (max-width: 720px) {
    .top-players { font-size: 10px; white-space: normal; }
  }
  tr.event-row td.col-series a {
    color: #6b7280; text-decoration: none;
  }
  tr.event-row td.col-series a:hover { color: #dc2626; text-decoration: underline; }

  th.col-date, td.col-date {
    width: 110px; font-variant-numeric: tabular-nums;
  }
  th.col-name, td.col-name {
    width: auto; min-width: 220px;
  }
  td.col-name .event-suffix { color: #9ca3af; font-size: 11px; margin-left: 4px; }
  th.col-nent, td.col-nent {
    width: 80px; text-align: right; font-variant-numeric: tabular-nums;
  }
  th.col-city, td.col-city {
    width: 110px; color: #6b7280; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  th.col-series, td.col-series { width: 160px; }
  th.col-tags, td.col-tags { width: 240px; }

  .tag {
    display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 8px;
    margin-right: 3px; margin-bottom: 2px; white-space: nowrap;
  }
  .tag-wk { background: rgba(220, 38, 38, 0.08); color: #dc2626; }
  .tag-wd { background: rgba(107, 114, 128, 0.10); color: #6b7280; }
  .tag-pre { background: rgba(168, 85, 247, 0.12); color: #6b21a8; }
  .tag-restr { background: rgba(217, 119, 6, 0.10); color: #d97706; }
  .tag-low { background: rgba(8, 145, 178, 0.10); color: #0e7490; }
  .tag-uchi { background: rgba(168, 85, 247, 0.12); color: #6b21a8; }
  .tag-special { background: rgba(236, 72, 153, 0.10); color: #be185d; }
  .tag-small { background: rgba(107, 114, 128, 0.12); color: #4b5563; }
  .tag-gf { background: #ffedd5; color: #9a3412; font-weight: 600; }

  .empty-msg { padding: 24px; text-align: center; color: #6b7280; }
  .footer { text-align: center; color: #9ca3af; font-size: 12px; padding: 32px 0 16px; }
  .footer a { color: #dc2626; text-decoration: none; }

  /* Mobile */
  @media (max-width: 720px) {
    body { font-size: 13px; }
    .header { padding: 12px 12px 0; }
    h1 { font-size: 18px; }
    .subtitle { font-size: 11px; }
    .controls { gap: 6px; }
    input[type="search"] { min-width: 0; width: 100%; flex: 1 1 100%; font-size: 14px; padding: 8px 10px; }
    .table-wrap { padding: 0 8px 24px; max-width: 100vw; overflow-x: hidden; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tr.event-row {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
      padding: 10px 8px; border-bottom: 1px solid #f3f4f6;
    }
    tr.event-row td { padding: 0; border: none; min-width: 0; text-align: left; }
    tr.event-row td.col-date {
      flex: 0 0 auto; font-size: 11px; color: #6b7280; order: 1;
    }
    tr.event-row td.col-nent {
      flex: 0 0 auto; font-size: 11px; color: #6b7280; order: 2;
      text-align: left;
    }
    tr.event-row td.col-nent::before { content: "👥 "; color: #9ca3af; }
    tr.event-row td.col-name {
      flex: 1 1 100%; font-size: 14px; font-weight: 500;
      word-break: break-all; order: 3;
    }
    tr.event-row td.col-city {
      flex: 0 0 auto; font-size: 11px; color: #6b7280;
      width: auto; order: 4;
    }
    tr.event-row td.col-city:empty { display: none; }
    tr.event-row td.col-city::before { content: "📍 "; color: #9ca3af; }
    tr.event-row td.col-series {
      flex: 0 0 auto; font-size: 11px; color: #6b7280;
      width: auto; order: 5;
    }
    tr.event-row td.col-series::before { content: "📋 "; color: #9ca3af; }
    tr.event-row td.col-tags {
      flex: 1 1 100%; order: 6; width: auto;
    }
  }
</style>
</head>
<body>

<div id="nav-root"></div>
<script src="../nav.js"></script>

<div class="header">
  <h1>大会一覧</h1>
  <p class="subtitle">SPSP に収録されているスマブラSP 日本大会の一覧</p>

  <div class="filter-section">
    <span class="filter-label">参加者数:</span>
    <div class="filter-chips" id="filter-nent" style="display:inline-flex">
      <span class="chip active" data-nent="0">すべて</span>
      <span class="chip" data-nent="8">8+</span>
      <span class="chip" data-nent="16">16+</span>
      <span class="chip" data-nent="32">32+</span>
      <span class="chip" data-nent="64">64+</span>
      <span class="chip" data-nent="128">128+</span>
    </div>
  </div>

  <div class="filter-section">
    <span class="filter-label">時期:</span>
    <div class="filter-chips" id="filter-period" style="display:inline-flex">
      <span class="chip active" data-period="0">すべて</span>
      <span class="chip" data-period="180">6ヶ月以内</span>
      <span class="chip" data-period="365">1年以内</span>
      <span class="chip" data-period="730">2年以内</span>
    </div>
  </div>

  <div class="filter-section">
    <span class="filter-label">タグ:</span>
    <div class="filter-chips" id="filter-tags" style="display:inline-flex">
      <span class="chip" data-tag="weekend">休日のみ</span>
      <span class="chip" data-tag="weekday">平日のみ</span>
      <span class="chip" data-tag="pre">プレ大会</span>
      <span class="chip" data-tag="restricted">制限</span>
      <span class="chip" data-tag="lower">下位クラス</span>
      <span class="chip" data-tag="uchi">身内</span>
      <span class="chip" data-tag="special">特殊ルール</span>
    </div>
  </div>

  <div class="controls">
    <input type="search" id="search" placeholder="大会名・イベント名・シリーズ名で検索…" autocomplete="off">
    <span class="status" id="status">読み込み中…</span>
  </div>
</div>

<div class="table-wrap">
  <table id="eventstable">
    <thead>
      <tr>
        <th class="col-date sortable sorted-desc" data-sort="date">開催日</th>
        <th class="col-name sortable" data-sort="name">大会名</th>
        <th class="col-nent sortable" data-sort="nent">参加者</th>
        <th class="col-city sortable" data-sort="city">開催地</th>
        <th class="col-series sortable" data-sort="series">シリーズ</th>
        <th class="col-tags">タグ</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="6" class="empty-msg">読み込み中…</td></tr>
    </tbody>
  </table>
</div>

<div class="footer" id="footer-info"></div>

<script>
'use strict';

const STATE = {
  events: [],
  filtered: [],
  searchText: '',
  minNent: 0,
  periodDays: 0,
  activeTags: new Set(),  // {weekend, weekday, pre, restricted, lower, uchi}
  sortKey: 'date',
  sortDir: 'desc',
  cap: 200,  // initial render cap
  showAll: false,
};

const INITIAL_CAP = 200;
const PAGE_INCREMENT = 200;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function applyFilters() {
  const ft = STATE.searchText.toLowerCase();
  const now = Date.now();
  const cutoff = STATE.periodDays > 0 ? (now - STATE.periodDays * 86400 * 1000) : null;
  STATE.filtered = STATE.events.filter(e => {
    if (ft) {
      const hay = (e.tournament_name + ' ' + (e.event_name || '') + ' ' + (e.series || '') + ' ' + (e.city || '') + ' ' + (e.venue || '')).toLowerCase();
      if (!hay.includes(ft)) return false;
    }
    if (e.nent < STATE.minNent) return false;
    if (cutoff != null) {
      const t = Date.parse(e.date + 'T00:00:00+09:00');
      if (Number.isFinite(t) && t < cutoff) return false;
    }
    const tags = STATE.activeTags;
    if (tags.size > 0) {
      // どれかの tag に match (= OR で絞る). weekend / weekday は排他に扱う.
      if (tags.has('weekend') && !e.is_weekend) return false;
      if (tags.has('weekday') && e.is_weekend) return false;
      if (tags.has('pre') && !e.is_pre) return false;
      if (tags.has('restricted') && !e.is_restricted) return false;
      if (tags.has('lower') && !e.is_lower_class) return false;
      if (tags.has('uchi') && !e.is_uchi) return false;
      if (tags.has('special') && !e.is_special_rules) return false;
    }
    return true;
  });
  const sign = STATE.sortDir === 'asc' ? 1 : -1;
  const k = STATE.sortKey;
  STATE.filtered.sort((a, b) => {
    if (k === 'date') return sign * (a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    if (k === 'name') return sign * a.tournament_name.localeCompare(b.tournament_name, 'ja');
    if (k === 'series') return sign * (a.series || '').localeCompare(b.series || '', 'ja');
    if (k === 'city') return sign * (a.city || '').localeCompare(b.city || '', 'ja');
    if (k === 'nent') return sign * (a.nent - b.nent);
    return 0;
  });
}

function render() {
  const tbody = document.getElementById('tbody');
  const rows = STATE.filtered;
  const shown = rows.slice(0, STATE.cap);
  if (shown.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">該当する大会なし</td></tr>';
  } else {
    const html = shown.map(e => {
      const tags = [];
      if (e.is_gf_missing) tags.push('<span class="tag tag-gf" title="決勝(Grand Finals)が未報告のため暫定順位のみ。ポイントは未反映で、結果確定後に集計されます">未完了</span>');
      if (e.is_weekend) tags.push('<span class="tag tag-wk">休日</span>');
      else if (e.is_weekend_real) tags.push('<span class="tag tag-wd" title="土日祝の開催ですが、ランキング計算上は平日大会として扱われます">実質平日</span>');
      else tags.push('<span class="tag tag-wd">平日</span>');
      if (e.is_pre) tags.push('<span class="tag tag-pre">プレ大会</span>');
      if (e.is_restricted) tags.push('<span class="tag tag-restr">制限</span>');
      if (e.is_lower_class) tags.push('<span class="tag tag-low">下位クラス</span>');
      if (e.is_uchi) tags.push('<span class="tag tag-uchi">身内</span>');
      if (e.is_special_rules) tags.push('<span class="tag tag-special">特殊ルール</span>');
      if (e.is_small) tags.push('<span class="tag tag-small" title="参加者数が少ないためランキング計算対象外">小規模</span>');
      const seriesLink = e.series
        ? `<a href="../local/ranking.html?series=${encodeURIComponent(e.series)}" onclick="event.stopPropagation()">${escapeHtml(e.series)}</a>`
        : '';
      const evtSuffix = e.event_name && !/^Singles\s*$|^Ultimate Singles\s*$|^1on1\s*$/i.test(e.event_name)
        ? `<span class="event-suffix">/ ${escapeHtml(e.event_name)}</span>` : '';
      const nameCell = e.has_detail
        ? `<a href="../t/?id=${e.event_id}">${escapeHtml(e.tournament_name)}</a>`
        : `<span class="no-detail">${escapeHtml(e.tournament_name)}</span>`;
      const medalEmoji = ['🥇', '🥈', '🥉'];
      const topPlayersHtml = (e.top_players && e.top_players.length)
        ? `<div class="top-players">${e.top_players.map((p, i) => {
            const m = medalEmoji[Math.min(i, 2)];
            const nameLink = p.display
              ? `<a href="../p/?uid=${p.uid}" onclick="event.stopPropagation()">${escapeHtml(p.display)}</a>`
              : `<span style="color:#9ca3af">(uid: ${p.uid})</span>`;
            const rankPart = (p.rank != null) ? `<span class="rank">#${p.rank}</span>` : '';
            return `<span><span class="place">${m}</span>${nameLink}${rankPart}</span>`;
          }).join('<span class="sep">·</span>')}</div>`
        : '';
      const cityText = e.city ? escapeHtml(e.city) : '';
      return `
        <tr class="event-row">
          <td class="col-date">${e.date}</td>
          <td class="col-name">${nameCell}${evtSuffix}${topPlayersHtml}</td>
          <td class="col-nent">${e.nent}</td>
          <td class="col-city" title="${e.venue ? escapeHtml(e.venue) : ''}">${cityText}</td>
          <td class="col-series">${seriesLink}</td>
          <td class="col-tags">${tags.join('')}</td>
        </tr>
      `;
    }).join('');
    let extra = '';
    if (rows.length > shown.length) {
      extra = `<tr><td colspan="6" class="empty-msg">下までスクロールでさらに表示 (残り ${rows.length - shown.length} 件)</td></tr>`;
    }
    tbody.innerHTML = html + extra;
  }
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (th.dataset.sort === STATE.sortKey) {
      th.classList.add(STATE.sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
    }
  });
  document.getElementById('status').textContent = `${rows.length} / ${STATE.events.length} 大会`;
}

function syncUrl() {
  const url = new URL(location.href);
  const set = (k, v, def) => {
    if (v == null || String(v) === String(def)) url.searchParams.delete(k);
    else url.searchParams.set(k, String(v));
  };
  set('q', STATE.searchText, '');
  set('minNent', STATE.minNent, 0);
  set('period', STATE.periodDays, 0);
  set('tags', [...STATE.activeTags].join(','), '');
  set('sort', STATE.sortKey, 'date');
  set('dir', STATE.sortDir, 'desc');
  history.replaceState(null, '', url.toString());
}

function readUrl() {
  const url = new URL(location.href);
  const q = url.searchParams.get('q');
  if (q) STATE.searchText = q;
  const mn = parseInt(url.searchParams.get('minNent') || '0', 10);
  if (Number.isFinite(mn) && mn >= 0) STATE.minNent = mn;
  const pd = parseInt(url.searchParams.get('period') || '0', 10);
  if (Number.isFinite(pd) && pd >= 0) STATE.periodDays = pd;
  const tg = url.searchParams.get('tags');
  if (tg) tg.split(',').filter(Boolean).forEach(t => STATE.activeTags.add(t));
  const sk = url.searchParams.get('sort');
  if (sk && ['date', 'name', 'nent', 'series'].includes(sk)) STATE.sortKey = sk;
  const sd = url.searchParams.get('dir');
  if (sd === 'asc' || sd === 'desc') STATE.sortDir = sd;
  // Reflect to UI
  document.getElementById('search').value = STATE.searchText;
  document.querySelectorAll('#filter-nent .chip').forEach(c => {
    c.classList.toggle('active', parseInt(c.dataset.nent, 10) === STATE.minNent);
  });
  document.querySelectorAll('#filter-period .chip').forEach(c => {
    c.classList.toggle('active', parseInt(c.dataset.period, 10) === STATE.periodDays);
  });
  document.querySelectorAll('#filter-tags .chip').forEach(c => {
    c.classList.toggle('active', STATE.activeTags.has(c.dataset.tag));
  });
}

function setupEvents() {
  document.getElementById('search').addEventListener('input', e => {
    STATE.searchText = e.target.value;
    syncUrl(); applyFilters(); STATE.cap = INITIAL_CAP; render();
  });
  document.querySelectorAll('#filter-nent .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#filter-nent .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      STATE.minNent = parseInt(chip.dataset.nent, 10) || 0;
      syncUrl(); applyFilters(); STATE.cap = INITIAL_CAP; render();
    });
  });
  document.querySelectorAll('#filter-period .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#filter-period .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      STATE.periodDays = parseInt(chip.dataset.period, 10) || 0;
      syncUrl(); applyFilters(); STATE.cap = INITIAL_CAP; render();
    });
  });
  document.querySelectorAll('#filter-tags .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const t = chip.dataset.tag;
      if (STATE.activeTags.has(t)) {
        STATE.activeTags.delete(t);
        chip.classList.remove('active');
      } else {
        // weekend / weekday は排他
        if (t === 'weekend' && STATE.activeTags.has('weekday')) {
          STATE.activeTags.delete('weekday');
          document.querySelector('#filter-tags .chip[data-tag="weekday"]').classList.remove('active');
        } else if (t === 'weekday' && STATE.activeTags.has('weekend')) {
          STATE.activeTags.delete('weekend');
          document.querySelector('#filter-tags .chip[data-tag="weekend"]').classList.remove('active');
        }
        STATE.activeTags.add(t);
        chip.classList.add('active');
      }
      syncUrl(); applyFilters(); STATE.cap = INITIAL_CAP; render();
    });
  });
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (STATE.sortKey === k) {
        STATE.sortDir = STATE.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        STATE.sortKey = k;
        STATE.sortDir = (k === 'name' || k === 'series' || k === 'city') ? 'asc' : 'desc';
      }
      syncUrl(); applyFilters(); render();
    });
  });
  // Infinite scroll: extend cap as user scrolls.
  window.addEventListener('scroll', () => {
    if (STATE.cap >= STATE.filtered.length) return;
    const scrollBottom = window.innerHeight + window.scrollY;
    const docHeight = document.documentElement.scrollHeight;
    if (scrollBottom > docHeight - 400) {
      STATE.cap = Math.min(STATE.filtered.length, STATE.cap + PAGE_INCREMENT);
      render();
    }
  });
}

async function init() {
  setupEvents();
  try {
    const t0 = performance.now();
    const res = await fetch('../data/tournaments.json');
    if (!res.ok) throw new Error('tournaments.json 取得失敗');
    const j = await res.json();
    STATE.events = j.tournaments || [];
    document.getElementById('footer-info').innerHTML =
      `tournaments.json generated ${escapeHtml(j.generated_at || '')} · ${STATE.events.length} 大会 · ` +
      `<a href="../index.html">全体ランキング</a> · <a href="../local/">ローカルランキング</a>`;
    readUrl();
    applyFilters();
    render();
    document.getElementById('status').textContent =
      `${STATE.filtered.length} / ${STATE.events.length} 大会 (${(performance.now()-t0).toFixed(0)}ms)`;
  } catch (e) {
    document.getElementById('tbody').innerHTML =
      `<tr><td colspan="6" class="empty-msg" style="color:#dc2626">${escapeHtml(e.message)}</td></tr>`;
  }
}

init();
</script>
</body>
</html>
