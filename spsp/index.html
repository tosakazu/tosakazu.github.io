<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .share-icon-btn:hover { background: #fef2f2 !important; color: #dc2626 !important; border-color: #dc2626 !important; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
    background: #ffffff; color: #111827; font-size: 14px;
    -webkit-text-size-adjust: 100%;
  }
  .nav {
    background: #ffffff; border-bottom: 1px solid #e5e7eb;
    padding: 12px 24px; display: flex; gap: 24px; align-items: center;
    position: sticky; top: 0; z-index: 10;
  }
  .nav a { color: #6b7280; text-decoration: none; font-size: 14px; padding: 4px 8px; border-radius: 4px; }
  .nav a:hover { color: #111827; background: #f3f4f6; }
  .nav a.current { color: #dc2626; background: #f3f4f6; }
  .nav .brand { font-size: 16px; color: #111827; font-weight: 600; margin-right: 16px; }
  .nav .brand a { color: #111827; font-size: 16px; padding: 0; }
  .nav .brand a:hover { background: transparent; }
  .nav .meta { margin-left: auto; color: #9ca3af; font-size: 12px; }

  .header { max-width: 1400px; margin: 0 auto; padding: 20px 24px 0; }
  h1 { font-size: 22px; color: #111827; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 12px; }

  /* News ticker stack (= auto / announcement それぞれ別行) */
  .news-stack { margin-bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
  .news-ticker {
    border-radius: 6px; overflow: hidden; white-space: nowrap;
    padding: 5px 0; font-size: 12px; position: relative;
    cursor: pointer; transition: filter .12s;
  }
  .news-ticker:hover { filter: brightness(0.97); }
  .news-ticker .ticker-close {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 44px; border: none;
    background: transparent; color: inherit; font-size: 16px;
    line-height: 1; padding: 0; cursor: pointer; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  .news-ticker .ticker-close::before {
    content: ''; position: absolute;
    right: 6px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 13px;
    background: rgba(255,255,255,0.6); transition: background .12s;
    z-index: -1;
  }
  .news-ticker .ticker-close:hover::before { background: #fff; }
  .news-ticker .ticker-close:hover { color: #dc2626; }
  .news-ticker.auto       { background: #eff6ff; border: 1px solid #dbeafe; color: #1e3a8a; }
  .news-ticker.announcement { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
  .news-ticker .label {
    position: absolute; left: 0; top: 0; bottom: 0;
    padding: 5px 10px; font-weight: 600; font-size: 11px; letter-spacing: 0.05em;
    z-index: 2; display: flex; align-items: center;
    text-decoration: none; transition: filter .12s;
  }
  .news-ticker .label:hover { filter: brightness(0.95); }
  .news-ticker.auto       .label { background: #dbeafe; color: #1e40af; }
  .news-ticker.announcement .label { background: #fef3c7; color: #92400e; }
  .news-ticker .content-wrap {
    margin-left: 0; overflow: hidden;
    /* label の右側だけ徐々に fade in. 左端 (= 0..72) は label, 右端 (= 44px) は × ボタン領域. */
    -webkit-mask-image: linear-gradient(to right,
      transparent 0, transparent 72px, #000 90px,
      #000 calc(100% - 60px), transparent calc(100% - 44px));
    mask-image: linear-gradient(to right,
      transparent 0, transparent 72px, #000 90px,
      #000 calc(100% - 60px), transparent calc(100% - 44px));
  }
  .news-ticker .content {
    display: inline-block; padding-left: 100%;
    /* animation-duration is set per-row via JS to keep px/sec speed constant. */
    animation: ticker-scroll 25s linear infinite;
  }
  .news-ticker:hover .content { animation-play-state: paused; }
  .news-ticker .content a { text-decoration: none; }
  .news-ticker.auto .content a { color: #1e3a8a; }
  .news-ticker.announcement .content a { color: #92400e; }
  .news-ticker .content a:hover { text-decoration: underline; }
  .news-ticker .sep { margin: 0 24px; opacity: 0.4; }
  .news-ticker .date { font-family: ui-monospace, monospace; opacity: 0.7; margin-right: 6px; font-size: 11px; }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }

  .method-tabs {
    display: flex; gap: 4px; margin: 12px 0;
    background: #ffffff; padding: 4px; border-radius: 8px;
    border: 1px solid #e5e7eb; overflow-x: auto;
  }
  .method-tab {
    padding: 8px 14px; cursor: pointer; border-radius: 6px;
    font-size: 13px; color: #6b7280; transition: all 0.1s;
    user-select: none; white-space: nowrap;
  }
  .method-tab:hover { color: #374151; background: #f3f4f6; }
  .method-tab.active { background: #dc2626; color: #fff; }
  .method-tab .tab-desc { display: block; font-size: 10px; opacity: 0.7; margin-top: 2px; }

  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0;
  }
  input, button, select {
    padding: 8px 12px; border: 1px solid #e5e7eb;
    background: #ffffff; color: #111827;
    border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  input[type="search"] { min-width: 280px; }
  button { cursor: pointer; }
  button:hover { background: #f3f4f6; border-color: #dc2626; }
  button.jump { font-size: 11px; padding: 4px 10px; }
  /* scroll-to-top floating button */
  #scroll-top {
    position: fixed; right: 24px; bottom: 24px; z-index: 50;
    width: 44px; height: 44px; border-radius: 22px; border: none;
    background: #dc2626; color: #fff; font-size: 20px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15);
    line-height: 1; padding: 0; transition: opacity .15s, transform .15s;
  }
  #scroll-top:hover { transform: translateY(-2px); }
  #scroll-top[hidden] { display: none; }
  .status { color: #6b7280; font-size: 12px; }

  .table-wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px 32px; }
  /* テーブル本体スタイル (table base, col widths, lv-badge, gate-pill, top-tours,
     player-name, rank-frac, detail-row 基底) は共有 ranking-table.css へ集約済. */

  /* レート/ポイント (順位評/直対評) の数値色: PC=黒、スマホ=デフォルト灰色。
     直対評は peak180==現在 (レート更新中) のとき PC で緑 (.bt-updating)。 */
  .score-cell { color: #111827; font-size: 11px; }
  .score-cell.bt-updating { color: #16a34a; }
  @media (max-width: 720px) {
    /* スマホ: 非更新中はデフォルト灰色。更新中 (.bt-updating) の緑は specificity が
       高いので上書きされず残る → PC/スマホ共通で更新中だけ緑。 */
    .score-cell { color: #9ca3af; }
  }

  .detail-explain {
    background: #f9fafb; border-left: 3px solid #dc2626;
    padding: 10px 16px; margin-bottom: 12px;
    font-size: 13px; color: #374151; line-height: 1.6;
  }
  .detail-explain strong { color: #111827; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h4 {
    margin: 0 0 8px; color: #dc2626; font-size: 13px; font-weight: 600;
  }
  .detail-section h5 {
    margin: 0 0 6px; color: #374151; font-size: 12px; font-weight: 600;
  }
  /* Detail tabs (大会別 / 直接対決) */
  .detail-tabs {
    display: flex; gap: 4px; margin: 4px 0 10px;
    border-bottom: 1px solid #e5e7eb;
  }
  .detail-tab {
    padding: 7px 14px; cursor: pointer; user-select: none;
    font-size: 13px; color: #6b7280; font-weight: 500;
    border-bottom: 2px solid transparent;
    border-radius: 4px 4px 0 0; transition: color .12s, background .12s, border-color .12s;
  }
  .detail-tab:hover {
    color: #dc2626; background: #fef2f2; border-bottom-color: #fca5a5;
  }
  .detail-tab.active {
    color: #dc2626; border-bottom-color: #dc2626; font-weight: 600;
  }
  /* H2H section (直接対決) */
  .h2h-section { display: flex; flex-direction: column; gap: 16px; }
  .h2h-col { min-width: 0; }
  .h2h-list { display: flex; flex-direction: column; gap: 6px; }
  .h2h-opp {
    border: 1px solid #f3f4f6; border-radius: 6px;
    padding: 8px 10px; background: #fafafa;
  }
  .h2h-opp.h2h-win  { border-left: 3px solid #16a34a; }
  .h2h-opp.h2h-loss { border-left: 3px solid #2563eb; }
  .h2h-head {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 4px;
  }
  .h2h-opp-name {
    color: #dc2626; font-weight: 600; text-decoration: none; font-size: 13px;
    word-break: break-word; min-width: 0;
  }
  .h2h-opp.h2h-win .h2h-opp-name { color: #16a34a; }
  .h2h-opp.h2h-loss .h2h-opp-name { color: #2563eb; }
  .h2h-opp-name:hover { text-decoration: underline; }
  .h2h-rank { color: #9ca3af; font-size: 11px; font-variant-numeric: tabular-nums; }
  .h2h-count { color: #6b7280; font-size: 11px; margin-left: auto; flex-shrink: 0; }
  .h2h-match {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 11px; color: #6b7280;
    padding: 3px 0;
  }
  .h2h-match .h2h-date { color: #9ca3af; font-size: 10px; flex-shrink: 0; }
  .h2h-match .h2h-tname { flex: 1 1 auto; min-width: 0; word-break: break-word; }
  .h2h-match .h2h-tname a { color: #6b7280; text-decoration: none; }
  .h2h-match .h2h-tname a:hover { color: #dc2626; text-decoration: underline; }
  .h2h-match .h2h-delta {
    font-weight: 700; font-variant-numeric: tabular-nums;
    color: #9ca3af; font-size: 12px; flex-shrink: 0;
  }
  .h2h-match .h2h-delta.pos { color: #16a34a; }
  .h2h-match .h2h-delta.neg { color: #2563eb; }
  /* PC: 勝/負 を 2 column */
  @media (min-width: 800px) {
    .h2h-section { flex-direction: row; gap: 20px; }
    .h2h-col { flex: 1 1 50%; }
  }

  /* Chart container */
  .chart-wrap {
    background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 6px;
    padding: 12px; margin: 8px 0;
  }
  .chart-tabs {
    display: flex; gap: 4px; margin-bottom: 8px;
  }
  .chart-tab {
    padding: 4px 10px; font-size: 11px; cursor: pointer; user-select: none;
    background: #ffffff; border-radius: 4px; color: #6b7280;
  }
  .chart-tab.active { background: #dc2626; color: #fff; }
  .chart-area { height: 220px; position: relative; }
  .chart-status { font-size: 11px; color: #9ca3af; }

  .tour-table, .breakdown-table { font-size: 12px; width: 100%; border-collapse: collapse; }
  .tour-table th, .breakdown-table th {
    background: #f9fafb; position: static; padding: 6px 8px;
    border-bottom: 1px solid #f3f4f6; cursor: default; font-weight: 600;
  }
  .tour-table th::after, .breakdown-table th::after { content: ""; }
  .tour-table td, .breakdown-table td { padding: 4px 8px; border-bottom: 1px solid #ffffff; }
  /* main row と opp row を視覚的に 1 つの行として連続させる (border-bottom を消す) */
  #ranktable .tour-table tr.tour-main-row td { border-bottom: none; }
  .tour-table tr.counted, .breakdown-table tr.counted { background: rgba(220, 38, 38, 0.04); }
  .tour-table tr.weekday { color: #6b7280; }
  .tour-table tr.weekend { color: #374151; }
  /* Hover ハイライト: 大会別詳細 1 行 (main + opp 連結) を 1 グループとして強調. */
  .tour-table tr.tour-main-row { transition: background 0.1s; }
  .tour-table tr.tour-opp-row { transition: background 0.1s; }
  .tour-table tr.tour-main-row:hover,
  .tour-table tr.tour-main-row:hover + tr.tour-opp-row,
  .tour-table tr.tour-opp-row:hover,
  .tour-table tr.tour-main-row:has(+ tr.tour-opp-row:hover) {
    background: #eef2f6 !important;
  }
  /* counted (= 赤背景) の上に hover が乗る場合は赤味を強めて区別 */
  .tour-table tr.tour-main-row.counted:hover,
  .tour-table tr.tour-main-row.counted:hover + tr.tour-opp-row,
  .tour-table tr.tour-opp-row.counted:hover,
  .tour-table tr.tour-main-row.counted:has(+ tr.tour-opp-row.counted:hover) {
    background: rgba(220, 38, 38, 0.07) !important;
  }
  /* 直対 H2H 各 entry の hover (default = #fafafa) */
  .h2h-opp { transition: background 0.1s, border-color 0.1s; }
  .h2h-opp:hover { background: #f0f0f0; border-color: #d1d5db; }
  /* Hidden extra rows (collapsed by default in 大会別詳細; expand button reveals). */
  .tour-table tr.extra-row.hidden-row { display: none !important; }
  .tag-wk { color: #dc2626; font-size: 10px; padding: 1px 5px; background: rgba(220, 38, 38, 0.08); border-radius: 8px; }
  .tag-wd { color: #6b7280; font-size: 10px; padding: 1px 5px; background: rgba(107, 114, 128, 0.08); border-radius: 8px; }
  .tag-sm { color: #d97706; font-size: 10px; padding: 1px 5px; background: rgba(217, 119, 6, 0.10); border-radius: 8px; margin-left: 4px; }
  .tag-pre { color: #6b21a8; font-size: 10px; padding: 1px 5px; background: rgba(168, 85, 247, 0.12); border-radius: 8px; margin-left: 4px; }
  .tag-res { color: #be123c; font-size: 10px; padding: 1px 5px; background: rgba(225, 29, 72, 0.10); border-radius: 8px; margin-left: 4px; }
  .tag-lc  { color: #0369a1; font-size: 10px; padding: 1px 5px; background: rgba(2, 132, 199, 0.10); border-radius: 8px; margin-left: 4px; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .pos { color: #16a34a; }
  .neg { color: #2563eb; }

  .footer { text-align: center; color: #9ca3af; font-size: 12px; padding: 32px 0 16px; }
  .empty-msg { padding: 24px; text-align: center; color: #6b7280; }

  .summary-row {
    display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 12px; font-size: 12px;
    background: #f9fafb; padding: 10px 14px; border-radius: 6px; border: 1px solid #f3f4f6;
  }
  .summary-row b { color: #111827; font-weight: 600; margin-right: 4px; }
  .summary-row span { color: #6b7280; }

  /* ── Mobile responsive (card layout) ── */
  @media (max-width: 720px) {
    body { font-size: 13px; }
    .nav { padding: 8px 12px; gap: 8px; font-size: 12px; flex-wrap: wrap; }
    .nav .brand { font-size: 14px; margin-right: 8px; }
    .nav a { padding: 3px 6px; font-size: 12px; }
    .nav .meta { width: 100%; margin-left: 0; font-size: 10px; }

    .header { padding: 12px 12px 0; }
    h1 { font-size: 18px; }
    .subtitle { font-size: 11px; margin-bottom: 10px; }

    .method-tabs { padding: 2px; gap: 2px; -webkit-overflow-scrolling: touch; }
    .method-tab { padding: 6px 8px; font-size: 11px; }
    .method-tab .tab-desc { display: none; }

    .controls { gap: 6px; }
    input[type="search"] { min-width: 0; flex: 1 1 100%; font-size: 14px; padding: 8px 10px; }
    #scroll-top { right: 16px; bottom: 16px; width: 40px; height: 40px; font-size: 18px; }
    .status { width: 100%; font-size: 10px; }

    .table-wrap { padding: 0 8px 24px; max-width: 100vw; overflow-x: hidden; }

    /* #ranktable mobile card layout (col-rank / col-display / col-avg-rank / col-score の grid 配置,
       補助列の非表示, detail-row 基底) は共有 ranking-table.css へ集約済. */

    /* Inner detail tables: TJPR breakdown keeps table layout; tour-table is converted below */
    .detail-row .breakdown-table { display: table; table-layout: auto; width: 100%; }
    .detail-row .breakdown-table thead { display: table-header-group; }
    .detail-row .breakdown-table tbody { display: table-row-group; }
    .detail-row .breakdown-table tfoot { display: table-footer-group; }
    .detail-row .breakdown-table tr { display: table-row; }
    .detail-row .breakdown-table td,
    .detail-row .breakdown-table th { display: table-cell; }

    .detail-explain { padding: 8px 10px; font-size: 12px; line-height: 1.55; word-wrap: break-word; }
    .detail-section { margin-bottom: 16px; box-sizing: border-box; max-width: 100%; }
    .detail-section h4 { font-size: 12px; }

    /* tour-table: 4 行 grid layout on mobile */
    .hscroll { overflow-x: visible; max-width: 100%; }
    .tour-table { display: block !important; min-width: 0; font-size: 12px; }
    .tour-table thead { display: none !important; }
    .tour-table tbody { display: block !important; }
    .tour-table tr {
      display: grid !important;
      grid-template-columns: auto auto auto 1fr auto auto;
      column-gap: 0;
      row-gap: 3px;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: #f9fafb;
      border-radius: 6px;
      border: 1px solid #f3f4f6;
      align-items: baseline;
    }
    .tour-table td { padding: 0 !important; border: none; font-size: 11px; color: #374151; line-height: 1.3; min-width: 0; }
    /* Row 1: 日付 + 区分 + Lv */
    .tour-table td:nth-child(1) { grid-column: 1; grid-row: 1; color: #dc2626; font-weight: 500; font-size: 11px; margin-right: 8px; }
    .tour-table td:nth-child(5) { grid-column: 2; grid-row: 1; margin-right: 4px; }   /* 区分 */
    .tour-table td:nth-child(6) { grid-column: 3; grid-row: 1; }   /* Lv */
    /* Row 2: 大会名 + 順位/人数 (横並び) */
    .tour-table td:nth-child(2) {
      grid-column: 1 / 5; grid-row: 2;
      font-size: 12px; word-break: break-word; line-height: 1.35;
    }
    .tour-table td:nth-child(3) {
      grid-column: 5; grid-row: 2;
      font-size: 14px; font-weight: 700; color: #111827; text-align: right;
    }
    .tour-table td:nth-child(4) {
      grid-column: 6; grid-row: 2;
      font-size: 11px; color: #6b7280;
    }
    /* Row 3: 順位評価 (寄与 (ベース)) + 直対評価 (両方目立つ、横並び) */
    .tour-table td:nth-child(7) {
      grid-column: 1 / 4; grid-row: 3;
      font-size: 14px; font-weight: 700; color: #dc2626; margin-top: 3px;
      text-align: left;
    }
    .tour-table td:nth-child(8) {
      grid-column: 4 / 7; grid-row: 3;
      font-size: 14px; font-weight: 700; color: #9ca3af; margin-top: 3px;
      text-align: right;
    }
    .tour-table td:nth-child(8).pos { color: #16a34a; }
    .tour-table td:nth-child(8).neg { color: #2563eb; }
    /* ::before ラベル */

<!-- Chart.js (lazy load on first graph use) -->
<script>
let CHART_LOADED = false;
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function ensureChartJs() {
  if (CHART_LOADED) return;
  await loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js');
  CHART_LOADED = true;
}

<script>
'use strict';

const DATA = [];
let META = null;
let currentMethod = 'ensemble';
let filterText = '';
// page-level state. sort / cap / filtered rows は TABLE (= SPSPRankingTable) 内部で保持.
// tourSortMode は SPSPDetail 内部で管理. PAGE_INCREMENT は infinite scroll の 1 段分.
const PAGE_INCREMENT = 512;

async function loadData() {
  const status = document.getElementById('status');
  status.textContent = 'JSONL ダウンロード中…';
  const t0 = performance.now();
  try {
    const [metaRes, jsonlRes, overseasRes, charIdxRes] = await Promise.all([
      fetch('meta.json'),
      fetch('latest_tjpr_full.jsonl'),
      fetch('data/overseas.json').catch(() => null),
      fetch('data/character_index.json').catch(() => null),
    ]);
    META = await metaRes.json();
    let overseasUids = null;
    if (overseasRes && overseasRes.ok) {
      try {
        const j = await overseasRes.json();
        overseasUids = new Set(j.uids || []);
      } catch (e) {}
    }
    let charIdx = null;
    if (charIdxRes && charIdxRes.ok) {
      try { charIdx = await charIdxRes.json(); } catch (e) {}
    }
    // ヘッダ (nav bar) に「最終更新時刻 · バージョン」を表示
    const genTime = (META.generated_at || META.eval_date || '').split('.')[0].replace('T', ' ');
    const SITE_VERSION_FULL = 'v ff27dc0 · 2026-06-19 21:03 UTC';
    const versionShort = SITE_VERSION_FULL.split(' · ')[0] || SITE_VERSION_FULL;
    const navMeta = document.getElementById('meta-info');
    if (navMeta) navMeta.textContent = `最終更新 ${genTime} · ${versionShort}`;
    document.getElementById('footer-info').innerHTML =
      `Generated ${META.eval_date} · ${META.n_players}名 · LOOKBACK ${META.lookback_days}日 · ` +
      `<a href="overview.html" style="color:#dc2626">概要</a> · ` +
      `<a href="details.html" style="color:#dc2626">詳細</a>`;
    const txt = await jsonlRes.text();
    const lines = txt.split('\n').filter(l => l.length);
    status.textContent = `${lines.length}行パース中…`;
    for (const line of lines) {
      try { DATA.push(JSON.parse(line)); } catch (e) {}
    }
    if (overseasUids && window.SPSPRankingTable && window.SPSPRankingTable.computeDisplayRanks) {
      window.SPSPRankingTable.computeDisplayRanks(DATA, overseasUids);
    }
    if (charIdx && window.SPSPRankingTable && window.SPSPRankingTable.attachZenichi) {
      window.SPSPRankingTable.attachZenichi(DATA, charIdx, overseasUids);
    }
    status.textContent = `${DATA.length}名 (${(performance.now()-t0).toFixed(0)}ms)`;
    render();
  } catch (e) {
    status.textContent = 'エラー: ' + e.message;
  }
}

function getRank(rec, method) {
  return rec.ranks[method] || Infinity;
}
function getScore(rec, method) {
  switch (method) {
    case 'tjpr':     return rec.scores.tjpr_score;
    case 'bt_gated': return rec.scores.bt_gated_elo;
    case 'ensemble':
    default: return -getRank(rec, 'ensemble');
  }
}
function formatScore(rec, method) {
  if (rec.unranked) return '–';
  switch (method) {
    case 'tjpr':     return rec.scores.tjpr_elo.toFixed(2);
    case 'bt_gated': return rec.scores.bt_gated_elo.toFixed(2);
    case 'ensemble':
    default: {
      const e = rec.scores.ensemble_avg_score != null
        ? rec.scores.ensemble_avg_score
        : (rec.scores.tjpr_elo + rec.scores.bt_gated_elo) / 2;
      return e.toFixed(1);
    }
  }
}
function formatAvgRank(rec, method) {
  if (rec.unranked) return '–';
  const ar = rec.scores.ensemble_avg_rank;
  return ar != null ? `#${ar.toFixed(1)}` : '–';
}

// ── Shared ranking-table component (SPSPRankingTable) ──
// columns / sort / filter / infinite scroll / row click は共有コンポーネントに集約.
// 平均スコア / 順位 のフォーマットは builtin column 経由 (= site/ranking-table.js).
let TABLE = null;
// 新方式 (= BT_LV_shared_cascade) 用の小灰列: 平均順位/平均スコア の代わりに
// 順位評スコア + 直対評スコアを小さく灰色で表示.
const _smallGray = (v, decimals = 1) =>
  v != null ? `<span class="score-cell">${v.toFixed(decimals)}</span>` : '–';
const TJPR_SCORE_COL = {
  id: 'tjpr_score_cell', label: '順位評', sortable: true, sortKey: 'tjpr_score',
  css: 'col-score',
  value: (rec) => -((rec.scores && rec.scores.tjpr_elo) || -Infinity),
  cell: (rec) => _smallGray(rec.scores && rec.scores.tjpr_elo, 2),
};
const BT_SCORE_COL = {
  id: 'bt_score_cell', label: '直対評', sortable: true, sortKey: 'bt_score',
  css: 'col-avg-rank',
  value: (rec) => -((rec.scores && rec.scores.bt_gated_elo) || -Infinity),
  // peak180 スコア == 現在スコア (= レート更新中) なら緑、ピークから下落していれば黒。
  cell: (rec) => {
    const sc = rec.scores || {};
    const peak = sc.bt_gated_elo;
    if (peak == null) return '–';
    const cur = sc.bt_internal_elo;
    const lastD = sc.bt_internal_d_last;
    // レート更新中 = peak180==現在スコア かつ 直前のレート変動が + (= 直近で上昇)。
    const updating = (cur != null && Math.abs(peak - cur) < 0.005 && lastD != null && lastD > 0);
    return `<span class="score-cell${updating ? ' bt-updating' : ''}">${peak.toFixed(2)}</span>`;
  },
};
function _columnsForMeta(meta) {
  const method = meta && meta.ranking_method;
  if (method && (method === 'BT_LV_shared_cascade' || method.startsWith('V4'))) {
    // Lv (tjpr_lv) と 計測中 (bt_weekday) は専用列を出さず、名前の横のタグ
    // (display-lv-mobile / display-gate-mobile) で PC/mobile 共通表示する。
    return ['rank', 'display', BT_SCORE_COL, TJPR_SCORE_COL,
            'tour_count', 'rank_tjpr', 'rank_bt_gated'];
  }
  return undefined;  // builtin default
}
function ensureTable() {
  if (TABLE) return TABLE;
  TABLE = new window.SPSPRankingTable.RankingTable({
    table: document.getElementById('ranktable'),
    rows: DATA,
    method: currentMethod,
    sort: { key: 'rank', dir: 'asc' },
    pageSize: PAGE_INCREMENT,
    infiniteScroll: true,
    totalForRankFrac: 'meta',         // 分母 = META.n_players
    playerHrefPrefix: '',             // ルート直下
    showTopTours: true,
    showDisplayBadges: true,
    btWeekdayStyle: 'pill',
    columns: _columnsForMeta(META),
    rowClick: (rec, tr, ev) => mainRowClickHandler(rec, tr, ev),
  });
  TABLE.meta = META;
  return TABLE;
}

function render() {
  const tbl = ensureTable();
  tbl.meta = META;
  tbl.setRows(DATA);
  tbl.setMethod(currentMethod);
  tbl.setFilterText(filterText);
}

function buildExplain(rec) {
  const total = META.n_players;
  const tc = rec.metadata.tour_count_3y;
  const wkInc = rec.metadata.bt_weekday_included !== false;
  const lv = rec.scores.shared_cascade_lv || rec.scores.tjpr_level;
  const lvDescs = {
    1: 'Lv1 (全員、フィルタなし)',
    2: 'Lv2 (top 2048、フィルタなし)',
    3: 'Lv3 (top 1024、nent>24)',
    4: 'Lv4 (top 512、nent>24 + 土日祝)',
    5: 'Lv5 (top 256、nent>48 + 土日祝)',
  };
  const lvFilter = {
    1: 'すべての大会 (3 年以内、min_entrants ≥ 8)',
    2: 'すべての大会 (Lv1 と同じだが base/floor が上)',
    3: '<strong>nent &gt; 24</strong> の一定規模以上の大会',
    4: '<strong>nent &gt; 24</strong> かつ <strong>土日祝</strong> の土日大会 (プレ大会・制限大会・下位クラスは除外)',
    5: '<strong>nent &gt; 48</strong> かつ <strong>土日祝</strong> の大きめ土日大会 (プレ大会・制限大会・下位クラスは除外)',
  };
  const ar = rec.scores.ensemble_avg_rank;
  const as_ = rec.scores.ensemble_avg_score;
  const ensAvg = (ar != null && as_ != null)
    ? ` <span style="color:#6b7280">(平均順位 #${ar.toFixed(1)} / 平均スコア ${as_.toFixed(1)})</span>`
    : '';
  return `
    <div class="detail-explain">
      <strong>ランク:</strong>
      総合評価 <strong>${rec.ranks.ensemble} / ${total}</strong>${ensAvg} ·
      順位評価 <strong>${rec.ranks.tjpr} / ${total}</strong> ·
      直対評価 <strong>${rec.ranks.bt_gated} / ${total}</strong><br>
      <strong>スコア:</strong>
      順位評価 <strong>${rec.scores.tjpr_elo.toFixed(2)}</strong> ·
      直対評価 <strong>${rec.scores.bt_gated_elo.toFixed(2)}</strong><br>
      <strong>直対評価 設定:</strong>
      このプレイヤーは 3 年間で <strong>${tc} 大会</strong>出場 ·
      ${wkInc
        ? `<span class="yn-yes">≤ 20 大会なので平日大会も学習</span> (レア帯保護)`
        : `<span class="yn-no">&gt; 20 大会なので土日祝のみ</span> (ベテラン)`}<br>
      <strong>順位評価 (Banzuke):</strong> ${lv > 0
        ? `到達 ${lvDescs[lv]} → 計上対象: ${lvFilter[lv]}`
        : `Banzuke 計算対象外`}
    </div>
  `;
}

function buildTjprBreakdown(rec) {
  const bd = rec.scores.tjpr_lv_breakdown || {};
  const lv = rec.scores.shared_cascade_lv || rec.scores.tjpr_level;
  const finalElo = rec.scores.tjpr_elo;
  const scale = (META.params && META.params.TJPR_ELO_SCALE) || 100.0;
  const offset = (META.params && META.params.TJPR_ELO_OFFSET != null) ? META.params.TJPR_ELO_OFFSET : 1500.0;
  const rows = [1,2,3,4,5].map(i => {
    const s = bd[i] || bd[String(i)] || 0;
    const isFinal = i === lv;
    const cls = isFinal ? 'lv-' + i : '';
    const filter = {
      1: '全員、フィルタなし',
      2: 'top 2048、フィルタなし',
      3: 'top 1024、nent>24',
      4: 'top 512、nent>24 + 土日祝',
      5: 'top 256、nent>48 + 土日祝',
    }[i];
    const reached = s > 0
      ? (isFinal ? '<span class="yn-yes">★ 採用</span>' : '<span style="color:#6b7280">到達</span>')
      : '<span style="color:#9ca3af">未到達</span>';
    const scaled = s > 0 ? (s * scale + offset).toFixed(1) : '–';
    return `
      <tr class="${cls}">
        <td><span class="lv-badge lv-${i}">Lv${i}</span></td>
        <td style="color:#6b7280">${filter}</td>
        <td class="num">${scaled}</td>
        <td>${reached}</td>
      </tr>
    `;
  }).join('');
  return `
    <div class="detail-section">
      <h4>順位評価 スコア内訳</h4>
      <table class="breakdown-table" style="max-width:640px">
        <thead>
          <tr><th>レベル</th><th>対象大会</th><th class="num">スコア</th><th>到達状況</th></tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr style="background:#f9fafb;border-top:2px solid #e5e7eb">
            <td colspan="2" style="color:#111827;font-weight:600">最終採用スコア (到達最高 Lv)</td>
            <td class="num"><strong>${finalElo.toFixed(1)}</strong></td>
            <td><span style="color:#6b7280">★</span></td>
          </tr>
        </tfoot>
      </table>
      <div style="font-size:11px;color:#9ca3af;margin-top:4px">
        ※ 各 Lv は対象大会を絞り直して別個に計算。プレイヤーは到達した最高 Lv のスコアでランクづけされる。<br>
        ※ 表示スコア = raw score × ${scale}${offset !== 0 ? ' + ' + offset : ''} (順位に影響しない線形変換)
      </div>
    </div>
  `;
}

function buildChartsSection(rec) {
  // hasLocal = seed/demo ページ (event-local rank が存在する)
  const hasLocal = rec.ranks.global_ensemble != null;
  const rankTabs = hasLocal

       <div class="chart-tab" data-chart="rank-global">順位推移 (全国)</div>`
    : `<div class="chart-tab active" data-chart="rank-global">順位の推移</div>`;
  return `
    <div class="detail-section">
      <h4>📈 履歴グラフ</h4>

// sortTournaments / uidToEnsembleRank / buildTournamentTable / buildH2HSection /
// buildDetailContent / DETAIL_CACHE / fetchPlayerDetail / escapeHtml は SPSPDetail
// (= site/player-detail.js) に集約済. tourSortMode も SPSPDetail 内部で管理.

// 詳細パネル (大会別 / 直接対決) を SPSPDetail に委譲するための cfg.
function getDetailCfg() {
  return {
    getMeta: () => META || {},
    getDataArray: () => DATA,
    pathPrefix: '',  // メインランキングはルート直下
  };
}

// ── Local-rank chart helpers (seed/demo only) ──
// 全参加者の history を遅延ロード。snapshot 日 -> 各 uid の global rank を保持。
let ALL_HISTORIES = null;          // Map<uid, history array>
let ALL_HISTORIES_LOADING = null;  // promise (in-flight)
const HIST_PATH_PREFIX = (window.PLAYERS_DIR && (window.PLAYERS_DIR + '/'))
  || (window.location.pathname.includes('/demo/') ? '../../players/'
      : window.location.pathname.includes('/seed/') ? '../players/'
      : 'players/');

async function ensureAllHistories(progressFn) {
  if (ALL_HISTORIES) return ALL_HISTORIES;
  if (ALL_HISTORIES_LOADING) return ALL_HISTORIES_LOADING;
  ALL_HISTORIES_LOADING = (async () => {
    const map = new Map();
    const uids = DATA.filter(r => r.user_id != null && !r.unranked).map(r => r.user_id);
    const total = uids.length;
    let done = 0;
    const BATCH = 30;
    for (let i = 0; i < uids.length; i += BATCH) {
      const slice = uids.slice(i, i + BATCH);
      await Promise.all(slice.map(async (uid) => {
        try {
          if (DETAIL_CACHE.has(uid)) {
            map.set(uid, (DETAIL_CACHE.get(uid).history) || []);
          } else {
            const res = await fetch(`${HIST_PATH_PREFIX}${uid}.json`);
            if (!res.ok) return;
            const j = await res.json();
            DETAIL_CACHE.set(uid, j);
            map.set(uid, j.history || []);
          }
        } catch (e) {}
      }));
      done += slice.length;
      if (progressFn) progressFn(done, total);
    }
    ALL_HISTORIES = map;
    return map;
  })();
  return ALL_HISTORIES_LOADING;
}

function computeLocalRankSeries(uid, allHist, k_hist, k_now) {
  // 各 snapshot day d ごとに entrants をその day の global rank で並べ、uid の event-local 順位を出す。
  // 1) snapshot 日のリストを META から取得。Chart.js は時系列順に並べる必要があるので、
  //    日付昇順 = days_ago 降順 (720, 690, ..., 30) でイテレート。
  const days = (META && META.snapshot_days) ? META.snapshot_days.slice() : [];
  days.sort((a, b) => b - a);  // 720, 690, ..., 30 (古い→新しい)
  // 2) 各 day で entrants -> rank マップ
  const result = [];
  for (const d of days) {
    const vals = [];
    for (const [u, hist] of allHist.entries()) {
      const h = (hist || []).find(x => x.d === d);
      if (!h) continue;
      const v = h[k_hist];
      if (v == null || v <= 0) continue;
      vals.push([u, v]);
    }
    vals.sort((a, b) => a[1] - b[1]);
    const idx = vals.findIndex(p => p[0] === uid);
    if (idx >= 0) result.push({ d, localRank: idx + 1 });
  }
  // 現在値 = DATA を rec.ranks[k_now] (= seed/demo の event-local rank) で並べた時の位置
  // → そのまま rec.ranks[k_now]
  return result;
}

function computeEventLocalRankNow(uid, k_global) {
  // DATA 全体を k_global の global rank で並べ、uid の位置 (= event-local 順位) を返す
  const vals = DATA
    .filter(r => !r.unranked && r.user_id != null && r.ranks[k_global] != null && r.ranks[k_global] > 0)
    .map(r => [r.user_id, r.ranks[k_global]]);
  vals.sort((a, b) => a[1] - b[1]);
  const idx = vals.findIndex(p => p[0] === uid);
  return idx >= 0 ? idx + 1 : null;
}

async function renderRankLocalChart(rec, container, canvas, status, dateFromDaysAgo) {
  status.textContent = '全参加者の履歴をロード中 …';
  const allHist = await ensureAllHistories((done, total) => {
    status.textContent = `履歴ロード中 ${done}/${total} …`;
  });
  status.textContent = '大会内ローカル順位を計算中 …';
  // k_global = 現在値計算用の global rank key
  // rec.ranks.tjpr / bt_gated は seed/demo では global を保持しているため、
  // event-local 順位を出すには DATA 全体を sort し直す必要がある
  const series = [
    { k_hist: 'ens',    k_global: 'global_ensemble',  label: '総合評価', color: '#dc2626' },
    { k_hist: 'tjpr_r', k_global: 'global_tjpr',      label: '順位評価',       color: '#d97706' },
    { k_hist: 'bt_g_r', k_global: 'global_bt_gated',  label: '直対評価',       color: '#16a34a' },
  ];
  const datasets = series.map(s => {
    const past = computeLocalRankSeries(rec.user_id, allHist, s.k_hist);
    const nowVal = computeEventLocalRankNow(rec.user_id, s.k_global);
    return {
      label: s.label,
      data: past.map(p => ({ x: dateFromDaysAgo(p.d), y: p.localRank }))
        .concat(nowVal != null && nowVal > 0 ? [{ x: META.eval_date, y: nowVal }] : []),
      borderColor: s.color,
      backgroundColor: s.color + '40',
      tension: 0.1, spanGaps: true,
    };
  });
  container._chart = new Chart(canvas, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type: 'time', time: { unit: 'month', tooltipFormat: 'yyyy-MM-dd' },
             ticks: { color: '#6b7280' }, grid: { color: '#f3f4f6' } },
        y: { reverse: true, title: { display: true, text: '大会内順位 (小さい=上位)', color: '#6b7280' },
             ticks: { color: '#6b7280' }, grid: { color: '#f3f4f6' } },
      },
      plugins: { legend: { labels: { color: '#374151' } } },
    },
  });
  const total = DATA.filter(r => !r.unranked).length;
  status.textContent = `大会内 ${total} 名中の遷移 + 今日 (${META.eval_date})`;
}

// ── Chart rendering ──
async function renderChart(rec, chartType, container) {
  const status = container.querySelector('.chart-status');
  status.textContent = 'Chart.js 読み込み中…';
  await ensureChartJs();
  const canvas = container.querySelector('canvas');
  if (container._chart) { container._chart.destroy(); container._chart = null; }

  const evalDate = new Date(META.eval_date + 'T00:00:00');
  const dateFromDaysAgo = (days) => {
    const d = new Date(evalDate);
    d.setDate(d.getDate() - days);
    return d.toISOString().slice(0, 10);
  };
  const hist = (rec.history || []).slice().sort((a, b) => b.d - a.d);

  if (chartType === 'rank-local') {
    await renderRankLocalChart(rec, container, canvas, status, dateFromDaysAgo);
    return;
  }
  if (chartType === 'rank-global' || chartType === 'rank') {
    // 全国順位グラフ: history (= global) + current global rank (rec.ranks.global_* があれば優先)
    const series = [
      { k_hist: 'ens',    k_now: 'ensemble', k_global: 'global_ensemble', label: '総合評価', color: '#dc2626' },
      { k_hist: 'tjpr_r', k_now: 'tjpr',     k_global: 'global_tjpr',     label: '順位評価',       color: '#d97706' },
      { k_hist: 'bt_g_r', k_now: 'bt_gated', k_global: 'global_bt_gated', label: '直対評価',       color: '#16a34a' },
    ];
    const datasets = series.map(s => {
      const nowVal = rec.ranks[s.k_global] != null ? rec.ranks[s.k_global] : rec.ranks[s.k_now];
      return {
      label: s.label,
      data: hist.map(h => ({ x: dateFromDaysAgo(h.d), y: h[s.k_hist] }))
        .concat([{ x: META.eval_date, y: nowVal }])
        .filter(p => p.y != null && p.y > 0),  // 0/null は ranked-out として除外
      borderColor: s.color,
      backgroundColor: s.color + '40',
      tension: 0.1, spanGaps: true,
      };
    });
    container._chart = new Chart(canvas, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { type: 'time', time: { unit: 'month', tooltipFormat: 'yyyy-MM-dd' },
               ticks: { color: '#6b7280' }, grid: { color: '#f3f4f6' } },
          y: { reverse: true, title: { display: true, text: '順位 (小さい=上位)', color: '#6b7280' },
               ticks: { color: '#6b7280' }, grid: { color: '#f3f4f6' } },
        },
        plugins: { legend: { labels: { color: '#374151' } } },
      },
    });
    status.textContent = `${hist.length} スナップショット + 今日 (${META.eval_date})`;
  }
  else if (chartType === 'tjpr_elo' || chartType === 'bt_elo') {
    const seriesByType = {
      tjpr_elo: { k_hist: 'tjpr_e', k_now: 'tjpr_elo',     label: '順位評価', color: '#d97706', title: '順位評価 スコア' },
      bt_elo:   { k_hist: 'bt_g_e', k_now: 'bt_gated_elo', label: '直対評価', color: '#16a34a', title: '直対評価 スコア' },
    };
    const s = seriesByType[chartType];
    const datasets = [{
      label: s.label,
      data: hist.map(h => ({ x: dateFromDaysAgo(h.d), y: h[s.k_hist] }))
        .concat([{ x: META.eval_date, y: rec.scores[s.k_now] }])
        .filter(p => p.y != null),
      borderColor: s.color,
      backgroundColor: s.color + '40',
      tension: 0.1, spanGaps: true,
      pointRadius: 4,
    }];
    container._chart = new Chart(canvas, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { type: 'time', time: { unit: 'month', tooltipFormat: 'yyyy-MM-dd' },
               ticks: { color: '#6b7280' }, grid: { color: '#f3f4f6' } },
          y: { title: { display: true, text: s.title, color: '#6b7280' },
               ticks: { color: '#6b7280' }, grid: { color: '#f3f4f6' } },
        },
        plugins: { legend: { labels: { color: '#374151' } } },
      },
    });
    const cur = chartType === 'tjpr_elo' ? rec.scores.tjpr_elo : rec.scores.bt_gated_elo;
    status.textContent = `現在 ${s.label} スコア ${cur.toFixed(1)}`;
  }
  else if (chartType === 'points') {
    // Per-tournament points: raw + weighted (after age/pos decay)
    const scale = (META.params && META.params.TJPR_ELO_SCALE) || 100.0;
    const ts = (rec.tournaments || []).slice().filter(t => t.tjpr_raw > 0).sort((a, b) => a.date.localeCompare(b.date));
    // Embed tournament meta in each point for tooltip access
    const datasets = [{
      label: '基本pt (素点 × ' + scale + ')',
      data: ts.map(t => ({ x: t.date, y: t.tjpr_raw * scale, _t: t })),
      backgroundColor: '#dc2626',
      borderColor: '#dc262680',
      pointRadius: 5, pointHoverRadius: 8,
      showLine: false,
    }, {
      label: '計上pt (age × pos_decay 適用 × ' + scale + ')',
      data: ts.map(t => ({ x: t.date, y: t.tjpr_w * scale, _t: t })),
      backgroundColor: '#d97706',
      borderColor: '#d9770680',
      pointRadius: 5, pointHoverRadius: 8,
      showLine: false,
    }];
    container._chart = new Chart(canvas, {
      type: 'scatter',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', intersect: true },
        scales: {
          x: { type: 'time', time: { unit: 'month', tooltipFormat: 'yyyy-MM-dd' },
               ticks: { color: '#6b7280' }, grid: { color: '#f3f4f6' } },
          y: { title: { display: true, text: '順位評価 計上pt', color: '#6b7280' },
               ticks: { color: '#6b7280' }, grid: { color: '#f3f4f6' } },
        },
        plugins: {
          legend: { labels: { color: '#374151' } },
          tooltip: {
            backgroundColor: '#ffffff',
            borderColor: '#e5e7eb', borderWidth: 1,
            titleColor: '#111827', bodyColor: '#374151',
            padding: 10,
            callbacks: {
              title: (items) => {
                if (!items.length) return '';
                const t = items[0].raw._t;
                return `${t.date}  ${t.name || ''}`;
              },
              label: (item) => {
                const t = item.raw._t;
                const lines = [
                  `${item.dataset.label}: ${item.parsed.y.toFixed(2)}`,
                  `順位: ${t.place || '?'} / ${t.nent}`,
                ];
                if (t.is_weekend !== undefined) {
                  const tags = [t.is_weekend ? '休日' : '平日'];
                  if (t.is_smapa) tags.push('スマパ');
                  if (t.is_pre) tags.push('プレ大会');
                  if (t.is_restricted) tags.push('制限大会');
                  if (t.is_lower_class) tags.push('下位クラス');
                  lines.push(tags.join(' / '));
                }
                return lines;
              },
            },
          },
        },
      },
    });
    status.textContent = `${ts.length} 大会 (順位評価 計上pt あり) · 現在スコア ${rec.scores.tjpr_elo.toFixed(2)} · 点をタップ/ホバーで詳細`;
  }
}

// Top N ジャンプボタン
document.querySelectorAll('.jump').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = parseInt(btn.dataset.jump);
    if (!TABLE) return;
    // 表示順位 (= jp-counter) で target に到達する行 index を先に走査して見つける.
    // 旧コード (= currentCap = target + 32) は raw rank == display rank を仮定して
    // いたが、海外勢込みの jp-counter では raw rank > display rank になるため
    // target ぴったりまで表示しても display rank が target に達していなかった.
    const getDR = window.SPSPRankingTable && window.SPSPRankingTable.getDisplayRank;
    const rowsData = TABLE._lastFiltered || [];
    let foundIdx = -1;
    for (let i = 0; i < rowsData.length; i++) {
      const dr = getDR ? getDR(rowsData[i], TABLE.method)
                       : ((rowsData[i].ranks && rowsData[i].ranks[TABLE.method]) || Infinity);
      if (dr >= target) { foundIdx = i; break; }
    }
    if (foundIdx < 0) return;
    if (TABLE.currentCap < foundIdx + 32 && rowsData.length > TABLE.currentCap) {
      TABLE.currentCap = Math.min(foundIdx + 32, rowsData.length);
      TABLE.refresh();
    }
    const tbody = document.getElementById('tbody');
    const rows = tbody.querySelectorAll('tr.main-row');
    if (rows[foundIdx]) {
      const row = rows[foundIdx];
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.style.background = '#fef3c7';
      setTimeout(() => row.style.background = '', 1500);
    }
  });
});

// Detail-row 内部のクリック処理 (= tab 切替 / H2H expand / tour-sort-toggle / expand-rows /
// chart toggle / chart-tab 切替). main-row クリックは RankingTable rowClick callback
// (= mainRowClickHandler) で処理.
document.getElementById('tbody').addEventListener('click', e => {
  // Detail tab switch (大会別 / 直接対決)
  const tabBtn = e.target.closest('.detail-tab');
  if (tabBtn) {
    e.stopPropagation();
    const section = tabBtn.closest('.detail-section');
    if (!section) return;
    const key = tabBtn.dataset.tab;
    section.querySelectorAll('.detail-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === key));
    section.querySelectorAll('.detail-tab-content').forEach(c => {
      c.style.display = c.classList.contains('tab-' + key) ? '' : 'none';
    });
    return;
  }
  // H2H 共通「もっと見る」 → 勝/負 両方の hidden を表示
  const h2hBtn = e.target.closest('.h2h-expand-btn');
  if (h2hBtn) {
    e.stopPropagation();
    const wrap = h2hBtn.closest('.tab-h2h');
    if (!wrap) return;
    wrap.querySelectorAll('.h2h-extra').forEach(x => x.style.display = '');
    const expandDiv = h2hBtn.closest('.h2h-expand');
    if (expandDiv) expandDiv.remove();
    return;
  }
  // Tournament sort toggle (page-level, applies to all open detail rows)
  const toggle = e.target.closest('.tour-sort-toggle');
  if (toggle) {
    e.stopPropagation();
    window.SPSPDetail.toggleSortMode();
    refreshOpenTournamentTables();
    return;
  }
  // Expand hidden rows in tour-table
  const expand = e.target.closest('.expand-rows');
  if (expand) {
    e.stopPropagation();
    const section = expand.parentElement;
    section.querySelectorAll('tr.extra-row').forEach(r => r.classList.remove('hidden-row'));
    expand.remove();
    return;
  }
  // Handle chart toggle button (inside detail-row). 現状 buildChartsSection は detail panel
  // から呼ばれていないが, 将来 chart-toggle ボタンを追加した時に動くよう listener は残す.
  if (e.target.classList.contains('chart-toggle')) {
    e.stopPropagation();
    const container = e.target.parentElement.querySelector('.chart-content');
    container.style.display = 'block';
    e.target.style.display = 'none';
    const rec = DATA.find(r => r.user_id == e.target.dataset.uid);
    const defaultChart = (rec.ranks.global_ensemble != null) ? 'rank-local' : 'rank-global';
    renderChart(rec, defaultChart, container).catch(err => {
      container.querySelector('.chart-status').textContent = 'グラフ描画エラー: ' + err.message;
      console.error(err);
    });
    return;
  }
  // Chart tab switch (inside detail-row)
  if (e.target.classList.contains('chart-tab')) {
    e.stopPropagation();
    const tabs = e.target.parentElement;
    const container = tabs.closest('.chart-content');
    tabs.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    const uid = container.dataset.uid;
    const rec = DATA.find(r => r.user_id == uid);
    renderChart(rec, e.target.dataset.chart, container).catch(err => {
      container.querySelector('.chart-status').textContent = 'グラフ描画エラー: ' + err.message;
      console.error(err);
    });
    return;
  }
  // main-row クリックは RankingTable rowClick callback (= mainRowClickHandler) で処理.
});

// main-row クリック → detail-row 展開 (大会別 / 直接対決 タブ含む).
// RankingTable の rowClick callback として ensureTable() から渡される.
function mainRowClickHandler(rec, tr, _ev) {
  if (!rec) return;
  const next = tr.nextElementSibling;
  if (next && next.classList && next.classList.contains('detail-row')) {
    next.remove();
    tr.classList.remove('expanded');
    return;
  }
  // 既に開いてる他の行は閉じる
  const table = tr.closest('table');
  const open = table.querySelector('tr.detail-row');
  if (open) {
    const prev = open.previousElementSibling;
    if (prev) prev.classList.remove('expanded');
    open.remove();
  }
  // Insert placeholder detail row, then fetch details async
  const detail = document.createElement('tr');
  detail.className = 'detail-row';
  if (rec.unranked) {
    detail.innerHTML = `<td colspan="7"><div class="detail-inner" style="padding:14px;font-size:12px;color:#6b7280">
      このプレイヤーは SPSP の DB に履歴がありません。<br>
      最下位扱いで CSV / アップロードには含まれます。
    </div></td>`;
    tr.classList.add('expanded');
    tr.after(detail);
    return;
  }
  detail.innerHTML = `<td colspan="7"><div class="detail-inner">
    <div class="loading-msg" style="padding:14px;color:#6b7280;font-size:12px">詳細情報を取得中…</div>
  </div></td>`;
  tr.classList.add('expanded');
  tr.after(detail);
  // Fetch per-player detail JSON via SPSPDetail (内部キャッシュ付き)
  const cfg = getDetailCfg();
  window.SPSPDetail.fetchPlayerDetail(rec.user_id, cfg).then(detailData => {
    if (!detailData) return;
    rec.tournaments = detailData.tournaments || [];
    rec.history = detailData.history || [];
    rec.recent_matches = detailData.recent_matches || [];
    if (rec.scores) rec.scores.tjpr_lv_breakdown = detailData.tjpr_lv_breakdown || {};
    const inner = detail.querySelector('.detail-inner');
    if (inner) inner.innerHTML = window.SPSPDetail.buildDetailContent(rec, cfg);
  }).catch(err => {
    const inner = detail.querySelector('.loading-msg');
    if (inner) inner.textContent = '詳細情報の取得に失敗: ' + err.message;
  });
}

// News tickers: load news.json and populate 速報 / 通知 separately (= 過去 24 時間以内)
(function loadNewsTickers() {
  const TICKER_SPEED_PX_PER_SEC = 60;  // 統一スピード (= 内容長に依らず一定)
  const WINDOW_MS = 24 * 60 * 60 * 1000;  // 表示対象: 過去 24 時間以内に投稿された entry
  const nowMs = Date.now();
  fetch('news.json').then(r => r.json()).then(data => {
    const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const buildContent = (items, filter) => {
      const href = `news/?filter=${filter}`;
      return items.slice(0, 10).map(n =>
        `<a href="${href}"><span class="date">${escH(n.date)}</span>${escH(n.title)}</a>`
      ).join('<span class="sep">●</span>');
    };
    // ニュース entry の timestamp 取得 (ms).
    // - datetime (ISO 8601 with time, e.g. "2026-05-19T15:30:00") があればそれを使う
    // - date のみ → ローカル 00:00:00 と解釈
    const entryTs = (n) => {
      if (n.datetime) {
        const t = new Date(n.datetime).getTime();
        return isNaN(t) ? 0 : t;
      }
      if (n.date) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(n.date);
        if (m) return new Date(+m[1], +m[2]-1, +m[3]).getTime();
      }
      return 0;
    };
    function setupTicker(rowId, contentId, items, filter) {
      if (!items.length) return;
      const row = document.getElementById(rowId);
      const content = document.getElementById(contentId);
      // Dismissed-state: localStorage に保存された dismiss 時刻 (ms) と news 最新時刻を比較.
      // dismiss 時刻 >= 最新 news 時刻なら hide. news が新しければ表示.
      const maxNewsTs = Math.max(0, ...items.map(entryTs));
      const dismissedRaw = localStorage.getItem(`spsp_ticker_dismissed_${rowId}`);
      const dismissedTs = dismissedRaw ? Number(dismissedRaw) : 0;
      if (dismissedTs && dismissedTs >= maxNewsTs) return;  // 既に dismiss 済 (= news 以降)
      content.innerHTML = buildContent(items, filter);
      row.style.display = '';
      // measure after layout settles; offsetWidth includes padding-left:100%
      requestAnimationFrame(() => {
        const distance = content.offsetWidth;
        const dur = Math.max(8, distance / TICKER_SPEED_PX_PER_SEC);
        content.style.animationDuration = `${dur.toFixed(1)}s`;
      });
      // Row-wide click → navigate (except for × button)
      row.addEventListener('click', (ev) => {
        if (ev.target.closest('.ticker-close')) return;
        if (ev.target.closest('a')) return;  // 内部リンクはデフォルト動作
        location.href = `news/?filter=${filter}`;
      });
      // × ボタン: hide + 現在時刻 (ms) を localStorage に保存. 後で新しい news が来たら自動再表示.
      const closeBtn = row.querySelector('.ticker-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          row.style.display = 'none';
          localStorage.setItem(`spsp_ticker_dismissed_${rowId}`, String(Date.now()));
        });
      }
    }
    const within24h = (n) => (nowMs - entryTs(n)) <= WINDOW_MS && entryTs(n) > 0;
    const auto = (data.auto_news || []).filter(within24h);
    const ann  = (data.announcements || []).filter(within24h);
    setupTicker('news-ticker-auto', 'ticker-auto-content', auto, 'auto');
    setupTicker('news-ticker-ann',  'ticker-ann-content',  ann,  'announcement');
  }).catch(() => {});
})();
</script>

<!-- Optional: load chartjs-adapter-date-fns for time scale -->
<script>
window.addEventListener('load', () => {
  // Defer load until first chart needed
});
</script>
