<meta name="robots" content="noindex">

<!--
  INV-8: このページには外部リソースを一切置かない。
  アナリティクス (nav.js が読み込む gtag) / CDN / 画像 / Web フォント すべて禁止。

<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">

</style>
</head>
