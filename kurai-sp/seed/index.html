<script>
// Preserve full path, query, hash. /banzuke/* → /spsp/*
(function () {
  var dest = location.pathname.replace(/^\/kurai-sp\//, '/spsp/');
  if (dest === location.pathname) dest = '/spsp/';
  location.replace(dest + location.search + location.hash);
})();
</script>
